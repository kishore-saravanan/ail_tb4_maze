[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".runtime", ".tools", "tools/maze2d", "scripts/benchmark_exploration.py"]
extend-include = ["resource/*"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["launch", "launch_ros", "rclpy"]
